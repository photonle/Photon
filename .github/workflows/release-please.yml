name: Release Please

on:
  push:
    branches: [development]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Maintain Release PR
    runs-on: ubuntu-latest
    steps:
      -
        name: Mint App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      -
        name: Release Please
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: development

  cut-release:
    name: Tag and Release on Master
    runs-on: ubuntu-latest
    needs: release-please
    steps:
      -
        name: Mint App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      -
        # A release is due when this push landed a manifest change (only release
        # PRs touch it) and its version has no tag yet. Both conditions come from
        # the repo itself, so re-runs are safe and nothing depends on
        # release-please's own label bookkeeping.
        name: Detect Release
        id: detect
        run: |
          version=$(jq -r '."."' .release-please-manifest.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          changed=$(git diff --name-only "${GITHUB_SHA}^" "${GITHUB_SHA}" || true)
          if ! printf '%s\n' "${changed}" | grep -qxF '.release-please-manifest.json'; then
            echo "Manifest untouched by this push; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/v${version}" > /dev/null; then
            echo "Tag v${version} already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Release v${version} is due."
          echo "release=true" >> "$GITHUB_OUTPUT"
      -
        # Not a force push: git rejects this if master has diverged, which is the
        # safety property we want. Recovery is deliberately manual.
        name: Fast-Forward Master
        if: steps.detect.outputs.release == 'true'
        run: git push origin "${GITHUB_SHA}:refs/heads/master"
      -
        name: Extract Release Notes
        if: steps.detect.outputs.release == 'true'
        run: awk '/^##[^#]/{n++} n==1' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
      -
        # Targeting the SHA rather than "master" keeps the tag correct even if
        # something else lands on master between the push and here.
        name: Create Release
        if: steps.detect.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.detect.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md"
      -
        # Mirrors release-please's own state model so the merged PR reads as
        # released. Cosmetic, so a missing label must not fail the run.
        name: Mark Release PR Tagged
        if: steps.detect.outputs.release == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq 'first | .number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged"
          fi
